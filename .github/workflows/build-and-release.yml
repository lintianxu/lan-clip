name: Build & Release LanClip

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Universal (Apple Silicon + Intel)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run macOS 10-part Protocol & File Transfer Tests
        run: |
          swiftc -O -swift-version 5 -parse-as-library \
            -framework Network -framework CryptoKit -framework Security \
            macos/Sources/Protocol.swift macos/Sources/NetworkEngine.swift macos/Tests/ProtocolTest.swift \
            -o /tmp/lanclip_macos_test
          /tmp/lanclip_macos_test
          rm -f /tmp/lanclip_macos_test

      - name: Build Universal macOS App & Zip
        run: |
          sh macos/build.sh
          lipo -info "build/局域网快传.app/Contents/MacOS/LanClip"
          codesign --verify --deep --strict "build/局域网快传.app"
          plutil -lint "build/局域网快传.app/Contents/Info.plist"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/LanClip-v*-macOS-universal.zip

  build-windows:
    name: Windows x64 Portable Tray App
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: windows/go.sum

      - name: Run Go Vector & Engine Tests
        working-directory: windows
        run: go test -v ./...

      - name: Build Windows GUI Executable
        working-directory: windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path ..\build | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o ..\build\LanClip-v3.0.0-Windows-x64.exe .\cmd\lanclip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/LanClip-v*-Windows-x64.exe

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android 35 SDK
        run: |
          SDKMGR="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android 35 SDK Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin Vector & Engine Unit Tests
        working-directory: android
        run: gradle test --no-daemon

      - name: Prepare Signing Keystore & Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/lanclip_release.jks
            export LANCLIP_KEYSTORE_PATH="/tmp/lanclip_release.jks"
            export LANCLIP_KEYSTORE_PASS="${ANDROID_KEYSTORE_PASS}"
            export LANCLIP_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            export LANCLIP_KEY_PASS="${ANDROID_KEY_PASS}"
          else
            keytool -genkeypair -v -keystore /tmp/lanclip_release.jks \
              -alias lanclip -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lanclip123 -keypass lanclip123 \
              -dname "CN=LanClip, OU=OpenSource, O=LanClip, L=Local, ST=Local, C=CN"
            export LANCLIP_KEYSTORE_PATH="/tmp/lanclip_release.jks"
            export LANCLIP_KEYSTORE_PASS="lanclip123"
            export LANCLIP_KEY_ALIAS="lanclip"
            export LANCLIP_KEY_PASS="lanclip123"
          fi
          gradle assembleRelease --no-daemon
          mkdir -p ../build
          cp app/build/outputs/apk/release/app-release.apk ../build/LanClip-v3.0.0-Android.apk
          rm -f /tmp/lanclip_release.jks

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/LanClip-v*-Android.apk

  publish-release:
    name: Publish Multi-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release_assets
          find dist -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.apk" \) -exec cp {} release_assets/ \;
          cat > /tmp/release_notes.md <<'EOF'
          ## LanClip 局域网快传 — macOS / Windows / Android 三端互通端到端加密版

          **无需同一个 Apple ID · 无需开启系统远程登录 · 零云端服务器**
          macOS、Windows 和安卓手机在同一局域网内输入一次 **6 位验证码**即可互相绑定进信任设备列表，实现**剪贴板文字秒传**与**大文件分片加密传输**。

          ### 为什么更安全？（文字与文件全程 100% 端到端加密）
          - **传文件也全程端到端加密**：不仅是文字，发送文件时的**文件名、文件大小、每片 256 KB 数据分片、SHA-256 完整性校验码和接收回执**均使用每次协商的独立临时 `X25519` 会话密钥 + `AES-256-GCM` 加密传输，绝不以明文暴露给同网段其他设备。
          - **双向签名认证 + 抗暴破配对**：每次传输前先校验彼此 `Ed25519` 身份签名再发出任何数据；6 位验证码 180 秒过期、单次消费作废、连续输错 5 次锁定。
          - **严格内网边界与零覆盖保存**：仅放行局域网私有网段（显式拒绝代理 TUN 网段 `198.18.0.0/15` 与公网）；文字纯内存直写剪贴板，文件安全落盘到各自「下载 / LanClip」目录并自动编号防覆盖。

          ### 三端下载与首次打开放行提示
          - **macOS (`LanClip-v3.0.0-macOS-universal.zip`)**：解压得到 `局域网传文字 / 局域网快传.app`（支持 Apple Silicon 与 Intel，macOS 13+）。若通过浏览器或隔空投送打开提示“已损坏”或“无法验证开发者”，在终端执行 `xattr -cr /Applications/局域网快传.app`，并在弹出本地网络权限时点击「允许」。
          - **Windows (`LanClip-v3.0.0-Windows-x64.exe`)**：单文件绿色托盘程序（Windows 10/11 64 位，免安装）。若弹出 SmartScreen 保护提示，点击「更多信息 → 仍要运行」，并在防火墙弹窗点「允许访问」。
          - **Android (`LanClip-v3.0.0-Android.apk`)**：支持 Android 8.0+，在文件管理器点击安装时如提示未知来源应用，按提示允许安装即可；开启接收开关时通知栏会保留一条安静的“加密接收中”提醒防止后台被清理。
          EOF
          gh release create "$TAG" release_assets/* \
            --title "LanClip $TAG (macOS + Windows + Android)" \
            --notes-file /tmp/release_notes.md
